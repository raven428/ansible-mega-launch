# kics-scan disable=555ab8f9-2001-455e-a077-f2d0f41e2fb9
# cspell:ignore dependabot lintignore megalipase
---
name: repo test
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "11 11 * * 1"
  # checkov:skip=CKV_GHA_7
  workflow_dispatch:
    inputs:
      mega_var_ref:
        description: "ansible-mega-var branch/tag to test against"
        required: false
        type: string
        default: ""
      mini_vault_ref:
        description: "ansible-mini-vault branch/tag/SHA to test against"
        required: false
        type: string
        default: ""
      mega_launch_ref:
        description: "ansible-launch-var branch/tag to test against"
        required: false
        type: string
        default: ""
      mega_service_ref:
        description: "ansible-mega-service branch/tag/SHA to test against"
        required: false
        type: string
        default: ""
permissions: {}
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MEGA_VAR_REF: ${{ inputs.mega_var_ref }}
  MEGA_SERVICE_REF: ${{ inputs.mega_service_ref }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  default:
    name: mol
    timeout-minutes: 33
    # jscpd:ignore-start
    runs-on: ubuntu-24.04
    needs:
      - pytest
    if: github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ansible_ver:
          - "06"
          - "07"
          - "08"
          - "09"
          - "10"
          - "11"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      # jscpd:ignore-end
      - name: test role
        env:
          ANSIBLE_VER: "${{ matrix.ansible_ver }}"
          ANSIBLE_GITHUB_TOKEN: ${{ secrets.LOCAL_WS_TOKEN }}
        run: molecule/default/run-tests.sh
  pytest:
    name: pyt
    timeout-minutes: 11
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ansible_ver:
          - "06"
          - "07"
          - "08"
          - "09"
          - "10"
          - "11"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: run tests
        env:
          ANSIBLE_VER: "${{ matrix.ansible_ver }}"
          ANSIBLE_GITHUB_TOKEN: ${{ secrets.LOCAL_WS_TOKEN }}
        run: tests/run-tests.sh
  mutmut:
    name: mut
    timeout-minutes: 22
    runs-on: ubuntu-24.04
    needs:
      - pytest
    if: github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: run mutmut
        env:
          ANSIBLE_VER: "11"
          ANSIBLE_GITHUB_TOKEN: ${{ secrets.LOCAL_WS_TOKEN }}
        run: tests/run-mutmut.sh
  linters:
    name: linters
    # jscpd:ignore-start
    timeout-minutes: 11
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'))
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      # jscpd:ignore-end
      - name: lint the repo
        shell: bash
        env:
          BRA: master
          USE_LINTIGNORE: true
        run: |
          curl -fsL \
          https://raw.githubusercontent.com/megalomania428/container-images/refs/heads/${{
          env.BRA }}/sources/linters-ubuntu-22_04/check-dir.sh | bash
          curl -fsL \
          https://raw.githubusercontent.com/megalomania428/container-images/refs/heads/${{
          env.BRA }}/_shared/install/ansible/check-dir.sh | bash
  MegaLinter:
    name: MegaLinter
    timeout-minutes: 11
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'))
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Run MegaLinter
        env:
          MEGALIPASE: "EDITORCONFIG_EDITORCONFIG_CHECKER_FILTER_REGEX_EXCLUDE"
          EDITORCONFIG_EDITORCONFIG_CHECKER_FILTER_REGEX_EXCLUDE: '(^|/)\.terminfo/'
        uses: megalomania428/github-actions/megalinter@master
  mega_service:
    name: test mega-service role
    timeout-minutes: 11
    runs-on: ubuntu-24.04
    needs:
      - default
      - pytest
      - mutmut
      - linters
      - MegaLinter
    if: "${{ !cancelled() && !failure() && (github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')) }}"
    permissions:
      contents: read
    steps:
      - name: trigger for mega-service role test
        env:
          GH_TOKEN: ${{ secrets.LOCAL_WS_TOKEN }}
          MEGA_VAR_REF: ${{ inputs.mega_var_ref || 'master' }}
          MINI_VAULT_REF: ${{ inputs.mini_vault_ref || 'master' }}
          MEGA_LAUNCH_REF: ${{ github.head_ref || github.ref_name }}
          MEGA_SERVICE_REF: ${{ inputs.mega_service_ref || 'master' }}
        run: 'gh workflow run test-role.yaml --repo raven428/ansible-mega-service --field
          mega_launch_ref="${MEGA_LAUNCH_REF}" --field mega_var_ref="${MEGA_VAR_REF}"
          --field  mini_vault_ref="${MINI_VAULT_REF}" --ref "${MEGA_SERVICE_REF}"'
  all-green:
    name: all green
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    needs:
      - default
      - pytest
      - mutmut
      - linters
      - MegaLinter
      - mega_service
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Check dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")'
